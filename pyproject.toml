# Installs the Python API (picam_client) on a PC:
#   pip install "git+https://github.com/phili-b/picam-web.git"
# The viewer and the web service themselves are installed on the Pi with install.sh.
[project]
name = "picam-client"
version = "1.2.0"
description = "Python API for the Picam-web camera service on Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "LGPL-2.1-or-later" }

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["picam_client"]
