name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # Raspberry Pi OS Trixie
      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install numpy pillow pytest pyflakes fastapi uvicorn httpx PyQt5
      - name: Lint (new modules)
        run: pyflakes picam_web picam_client picam_viewer/analysis.py picam_viewer/sensor_regs.py picam_viewer/panels.py picam_viewer/style.py picam_viewer/live.py picam_viewer/isp_stats.py picam_viewer/camera_panels.py tests examples
      - name: Compile everything
        run: python -m compileall -q picam_viewer picam_web picam_client tools examples tests
      - name: Unit and API tests (simulated camera)
        run: pytest -q tests
      - name: Desktop viewer, every button (simulated camera)
        run: QT_QPA_PLATFORM=offscreen python tests/fake/desktop_smoke.py
      - name: Check shell scripts
        run: bash -n install.sh picam_viewer/run_desktop.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run check
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, web, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the web UI
        run: cd web && npm ci && npm run build
      # The repository plus the built web UI (web/dist) and a VERSION file. The asset name is the
      # same for every release, so .../releases/latest/download/picam-web.tar.gz always works.
      - name: Build archive
        run: |
          echo "$GITHUB_REF_NAME" > VERSION
          git archive --prefix=picam-web/ -o picam-web.tar HEAD
          tar -rf picam-web.tar --transform 's,^,picam-web/,' web/dist VERSION
          gzip picam-web.tar
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" picam-web.tar.gz --generate-notes
